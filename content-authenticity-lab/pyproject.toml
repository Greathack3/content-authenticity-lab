[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-authenticity-lab"
version = "0.1.0"
description = "A command-line media metadata and SHA-256 manifest scanner"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Content Authenticity Lab"}]
dependencies = []

[project.scripts]
media-manifest = "content_authenticity_lab.cli:main"

[tool.setuptools.packages.find]
include = ["content_authenticity_lab*"]
